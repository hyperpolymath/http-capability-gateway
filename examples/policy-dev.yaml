# Example Verb Governance Policy (DSL v1)
# Development/Testing Configuration

dsl_version: "1"
governance:
  global_verbs:
    - GET
    - POST
  routes:
    - path: "^/health$"
      verbs: [GET]
    - path: "^/api/admin$"
      verbs: [GET]
    - path: "^/api/users/[0-9]+$"
      verbs: [GET, PUT, DELETE]
    - path: "^/api/posts/.+$"
      verbs: [GET, POST]
stealth:
  enabled: true
  status_code: 404
