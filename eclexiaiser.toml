# eclexiaiser manifest for http-capability-gateway

[project]
name = "http-capability-gateway"

[[functions]]
name = "serve"
source = "src/main.rs"
energy-budget-mj = 90.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
